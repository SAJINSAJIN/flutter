sonar.projectKey=my-first-flutter-project
sonar.projectName=myfirstproject
sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=**/*_test.dart

sonar.sourceEncoding=UTF-8
sonar.dart.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**