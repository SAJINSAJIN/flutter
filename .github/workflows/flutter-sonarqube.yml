
name: Flutter CI and SonarQube

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter CI and Coverage
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"

    env:
      FLUTTER_HOME: C:\Flutter\flutter_windows_3.47.5-stable\flutter
      MIN_COVERAGE: "90"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Flutter SDK
        run: |
          $flutterBin = Join-Path $env:FLUTTER_HOME "bin"

          if (!(Test-Path "$flutterBin\flutter.bat")) {
            throw "Flutter SDK not found: $flutterBin"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "Flutter SDK configured."

      - name: Verify Flutter
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter version check failed."
          }

          dart --version
          if ($LASTEXITCODE -ne 0) {
            throw "Dart version check failed."
          }

      - name: Verify project structure
        run: |
          if (!(Test-Path "pubspec.yaml")) {
            throw "pubspec.yaml not found."
          }

          if (!(Test-Path "lib")) {
            throw "Flutter lib directory not found."
          }

          $dartFiles = @(
            Get-ChildItem "lib" -Filter "*.dart" -Recurse -File
          )

          Write-Host "Dart source files: $($dartFiles.Count)"

          if ($dartFiles.Count -eq 0) {
            throw "No Dart source files found."
          }

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter dependency installation failed."
          }

      - name: Flutter static analysis
        run: |
          flutter analyze --no-pub

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter static analysis failed."
          }

      - name: Run Flutter tests with coverage
        run: |
          $testFiles = @(
            Get-ChildItem "test" -Filter "*_test.dart" -Recurse -File
          )

          if ($testFiles.Count -eq 0) {
            throw "No Flutter test files found."
          }

          flutter test --no-pub --coverage --machine `
            1> tests.output

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter tests failed."
          }

          if (!(Test-Path "tests.output")) {
            throw "Test report was not generated."
          }

          if (!(Test-Path "coverage\lcov.info")) {
            throw "Coverage report was not generated."
          }

      - name: Enforce minimum line coverage
        run: |
          $coverageFile = Join-Path `
            $env:GITHUB_WORKSPACE "coverage\lcov.info"

          if (!(Test-Path $coverageFile)) {
            throw "Coverage report not found."
          }

          $totalLF = 0
          $totalLH = 0

          foreach ($line in [System.IO.File]::ReadLines($coverageFile)) {
            if ($line -match '^LF:(\d+)\s*$') {
              $totalLF += [long]$Matches[1]
            }
            elseif ($line -match '^LH:(\d+)\s*$') {
              $totalLH += [long]$Matches[1]
            }
          }

          if ($totalLF -le 0) {
            throw "No executable lines found in coverage."
          }

          if ($totalLH -gt $totalLF) {
            throw "Invalid coverage report."
          }

          $coverage = 100.0 * $totalLH / $totalLF
          $minimum = [double]$env:MIN_COVERAGE

          Write-Host "================================"
          Write-Host ("Line coverage: {0:N2}%" -f $coverage)
          Write-Host "Covered lines: $totalLH"
          Write-Host "Total lines: $totalLF"
          Write-Host ("Minimum: {0:N2}%" -f $minimum)
          Write-Host "================================"

          if ($coverage -lt $minimum) {
            throw ("Coverage {0:N2}% below {1:N2}%" -f `
              $coverage, $minimum)
          }

          Write-Host "Coverage requirement passed."

      - name: SonarQube Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "SONAR_HOST_URL is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN is not configured."
          }

          if (!(Test-Path "sonar-project.properties")) {
            throw "sonar-project.properties not found."
          }

          $scannerVersion = "7.2.0.5079"
          $scannerFile = "sonar-scanner-cli-$scannerVersion-windows-x64.zip"

          $scannerUrl = `
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/$scannerFile"

          $scannerZip = Join-Path $env:RUNNER_TEMP $scannerFile
          $scannerRoot = Join-Path $env:RUNNER_TEMP "sonar-scanner"

          Invoke-WebRequest `
            -Uri $scannerUrl `
            -OutFile $scannerZip `
            -ErrorAction Stop

          if (Test-Path $scannerRoot) {
            Remove-Item $scannerRoot -Recurse -Force
          }

          Expand-Archive `
            -Path $scannerZip `
            -DestinationPath $scannerRoot `
            -Force

          $scanner = Get-ChildItem `
            -Path $scannerRoot `
            -Filter "sonar-scanner.bat" `
            -Recurse |
            Select-Object -First 1 -ExpandProperty FullName

          if (!$scanner) {
            throw "SonarScanner executable not found."
          }

          Write-Host "Running SonarQube analysis..."

          & $scanner `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true" `
            "-Dsonar.qualitygate.timeout=600"

          $scanExitCode = $LASTEXITCODE

          if ($scanExitCode -ne 0) {
            throw "SonarQube scan failed. Exit code: $scanExitCode"
          }

          Write-Host "SonarQube quality gate passed."
