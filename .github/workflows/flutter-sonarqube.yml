
name: Flutter CI and SonarQube

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  flutter-quality:
    name: Flutter CI and SonarQube
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Java for SonarScanner
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Configure the existing Flutter SDK on Windows
      - name: Set up Flutter
        run: |
          $ErrorActionPreference = "Stop"

          $flutterRoot = "C:\Flutter\flutter_windows_3.47.5-stable\flutter"
          $flutterBin = Join-Path $flutterRoot "bin"
          $flutterExe = Join-Path $flutterBin "flutter.bat"

          if (!(Test-Path $flutterExe)) {
            throw "Flutter SDK not found at $flutterExe"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin

          & $flutterExe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter version check failed."
          }

      # 4. Install dependencies
      - name: Install Flutter dependencies
        run: |
          flutter pub get

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter dependency installation failed."
          }

      # 5. Analyze Dart and Flutter code
      - name: Flutter analyze
        run: |
          flutter analyze --no-pub

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter analysis failed."
          }

      # 6. Run tests and generate LCOV coverage
      - name: Run Flutter tests with coverage
        run: |
          flutter test --no-pub --coverage

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter tests failed."
          }

      # 7. Verify coverage report
      - name: Verify coverage report
        run: |
          $coverageFile = Join-Path $env:GITHUB_WORKSPACE "coverage\lcov.info"

          if (!(Test-Path $coverageFile)) {
            throw "Coverage report not found: $coverageFile"
          }

          $report = Get-Content $coverageFile -Raw

          if ($report -notmatch 'LF:\d+') {
            throw "Coverage report contains no valid LF records."
          }

          Write-Host "Flutter coverage report found: $coverageFile"

      # 8. Download, extract, and run SonarScanner manually
      - name: SonarQube scan and enforce quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "GitHub secret SONAR_TOKEN is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "GitHub secret SONAR_HOST_URL is missing."
          }

          $version = "7.2.0.5079"
          $zip = Join-Path $env:RUNNER_TEMP "sonar-scanner.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sonar-scanner"

          $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$version-windows-x64.zip"

          Write-Host "Downloading SonarScanner $version..."

          Invoke-WebRequest -Uri $url -OutFile $zip

          if (!(Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "SonarScanner ZIP download failed."
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null

          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $scanner = Get-ChildItem $extract `
            -Filter "sonar-scanner.bat" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName

          if (!$scanner) {
            throw "sonar-scanner.bat was not found."
          }

          Write-Host "Running SonarQube analysis..."

          & $scanner `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true" `
            "-Dsonar.qualitygate.timeout=600"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis failed or the quality gate was not passed."
          }

          Write-Host "SonarQube analysis and quality gate passed."
