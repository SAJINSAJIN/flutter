
name: Flutter CI and SonarQube

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  flutter-quality:
    name: Flutter CI and SonarQube
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        shell: powershell
        run: |
          $flutterRoot = "C:\Flutter\flutter_windows_3.47.5-stable\flutter"
          $flutterBin = Join-Path $flutterRoot "bin"
          $flutterExe = Join-Path $flutterBin "flutter.bat"

          if (!(Test-Path $flutterExe)) {
            throw "Flutter SDK not found at $flutterRoot"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin

          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter version check failed"
          }

      - name: Install Flutter dependencies
        shell: powershell
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter dependency installation failed"
          }

      - name: Analyze Flutter code
        shell: powershell
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter analysis failed"
          }

      - name: Run tests and generate coverage
        shell: powershell
        run: |
          flutter test --no-pub --coverage
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter tests failed"
          }

      - name: Verify coverage report
        shell: powershell
        run: |
          $coverageFile = "coverage/lcov.info"

          if (!(Test-Path $coverageFile)) {
            throw "Coverage report not found: $coverageFile"
          }

          $coverageContent = Get-Content $coverageFile -Raw
          if ($coverageContent -notmatch "LF:" -or
              $coverageContent -notmatch "LH:") {
            throw "LCOV report does not contain line coverage data"
          }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
