
name: Flutter CI and SonarQube

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter CI and Coverage
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File "{0}"

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Java for SonarScanner
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Add existing Flutter SDK to PATH
      - name: Configure Flutter SDK
        run: |
          $flutterPath = "C:\Flutter\flutter_windows_3.47.5-stable\flutter"

          if (!(Test-Path "$flutterPath\bin\flutter.bat")) {
            throw "Flutter SDK not found at $flutterPath"
          }

          Add-Content -Path $env:GITHUB_PATH -Value "$flutterPath\bin"

          Write-Host "Flutter SDK path configured."

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      # 4. Install project dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Check Dart code
      - name: Flutter analyze
        run: flutter analyze --no-pub

      # 6. Run tests and generate LCOV coverage
      - name: Run Flutter tests with coverage
        run: |
          flutter test --no-pub --coverage

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter tests failed."
          }

          if (!(Test-Path "coverage\lcov.info")) {
            throw "Coverage report was not generated."
          }

      # 7. Enforce minimum 95% line coverage
      - name: Enforce minimum 95% line coverage
        run: |
          $coverageFile = Join-Path $env:GITHUB_WORKSPACE "coverage\lcov.info"

          if (!(Test-Path $coverageFile)) {
            throw "Coverage report not found: $coverageFile"
          }

          $report = Get-Content $coverageFile -Raw

          $lfMatches = [regex]::Matches(
            $report,
            '(?m)^LF:(\d+)\s*$'
          )

          $lhMatches = [regex]::Matches(
            $report,
            '(?m)^LH:(\d+)\s*$'
          )

          $totalLF = 0
          foreach ($match in $lfMatches) {
            $totalLF += [int]$match.Groups[1].Value
          }

          $totalLH = 0
          foreach ($match in $lhMatches) {
            $totalLH += [int]$match.Groups[1].Value
          }

          if ($totalLF -le 0) {
            throw "No executable lines found in the coverage report."
          }

          $coverage = 100.0 * $totalLH / $totalLF

          Write-Host ""
          Write-Host "========================================"
          Write-Host ("Line coverage: {0:N2}%" -f $coverage)
          Write-Host ("Covered lines: {0}" -f $totalLH)
          Write-Host ("Total lines:   {0}" -f $totalLF)
          Write-Host "Required:      90.00%"
          Write-Host "========================================"

          if ($coverage -lt 90.0) {
            throw ("Coverage {0:N2}% is below the required 95%." -f $coverage)
          }

          Write-Host "Coverage requirement passed."

      # 8. Run SonarQube only on main branch pushes
      - name: SonarQube Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "GitHub secret SONAR_HOST_URL is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "GitHub secret SONAR_TOKEN is not configured."
          }

          if (!(Test-Path "sonar-project.properties")) {
            throw "sonar-project.properties was not found in the repository root."
          }

          # Download SonarScanner CLI
          $scannerZip = Join-Path $env:RUNNER_TEMP "sonar-scanner.zip"
          $scannerRoot = Join-Path $env:RUNNER_TEMP "sonar-scanner"

          $scannerUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-windows-x64.zip"

          Invoke-WebRequest `
            -Uri $scannerUrl `
            -OutFile $scannerZip

          if (Test-Path $scannerRoot) {
            Remove-Item $scannerRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $scannerRoot -Force | Out-Null

          Expand-Archive `
            -Path $scannerZip `
            -DestinationPath $scannerRoot `
            -Force

          $scanner = Get-ChildItem `
            -Path $scannerRoot `
            -Filter "sonar-scanner.bat" `
            -Recurse |
            Select-Object -First 1 -ExpandProperty FullName

          if (!$scanner) {
            throw "SonarScanner executable was not found after extraction."
          }

          Write-Host "Running SonarQube analysis..."

          & $scanner `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true" `
            "-Dsonar.qualitygate.timeout=600"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis failed or the quality gate was not passed."
          }

          Write-Host "SonarQube analysis and quality gate passed."
